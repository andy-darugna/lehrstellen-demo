version: 2

models:
  - name: staging_schueler
    description: "Schüler ohne PII, dedupliziert und typisiert"
    columns:
      - name: schueler_id
        data_tests:
          - unique
          - not_null
      - name: geschlecht
        data_tests:
          - accepted_values:
              arguments:
                values: ['weiblich', 'männlich', 'divers']
      - name: schultyp
        data_tests:
          - accepted_values:
              arguments:
                values: ['Sek A', 'Sek B', 'Sek C', 'Bezirksschule', '10. Schuljahr']
      - name: notenschnitt
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 6
              config:
                severity: warn

  - name: staging_schueler_pii
    description: "Identifizierende Schülerdaten (PII). Eigener Datensatz mit eingeschränktem Zugriff, Join über schueler_id."
    config:
      meta:
        contains_pii: true
        data_classification: confidential
    columns:
      - name: schueler_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_schueler')
                field: schueler_id
      - name: email
        description: "Klartext-E-Mail, nur für berechtigte Personen"
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: email_key
        description: "SHA-256-Hash der normalisierten E-Mail, Join-Schlüssel ohne Klartext"